name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: universe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/universe_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/universe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # As migrações precisam produzir exatamente o schema.prisma (o erro "coluna não existe" em produção).
      - run: npx prisma migrate deploy
      - name: Schema × migrações
        run: node --import tsx --test tests/schema-drift.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint src
